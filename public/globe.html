<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Global Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="globe.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%230b3d5c' stroke='%233a352b' stroke-width='1.5'/><ellipse cx='16' cy='16' rx='6' ry='13' fill='none' stroke='%2359c2e8' stroke-width='1.2'/><path d='M3 16h26M6 9h20M6 23h20' stroke='%2359c2e8' stroke-width='1.2' fill='none'/></svg>"
    />
    <!-- Served out of node_modules, not a CDN: the dashboard works offline. -->
    <script src="/vendor/globe/globe.gl.min.js"></script>
  </head>
  <body data-mode="idle">
    <div class="desktop">
      <div class="window window-globe">
        <div class="title-bar">
          <span class="title-icon title-icon-globe" aria-hidden="true"></span>
          <span class="title-text">Global Dashboard</span>
          <span class="title-buttons" aria-hidden="true">
            <span class="title-btn">&#95;</span>
            <span class="title-btn">&#9633;</span>
            <span class="title-btn title-btn-close">&#10005;</span>
          </span>
        </div>

        <div class="window-body globe-body">
          <div class="globe-well">
            <div id="globe"></div>
            <p id="globe-loading" class="globe-loading">Loading the world…</p>
          </div>

          <div class="globe-side">
            <div class="search-row">
              <input
                id="search"
                type="text"
                placeholder="Fly to a place…"
                autocomplete="off"
                spellcheck="false"
                aria-label="Search for a place"
              />
              <button id="home-btn" class="btn icon-btn" title="Back to where you are">⌂</button>
            </div>
            <ul id="results" class="results" hidden></ul>

            <div class="fieldset">
              <div class="fieldset-label">Selection</div>
              <p id="place" class="place">Click a country.</p>
              <p id="coords" class="coords"></p>
              <p id="localtime" class="localtime"></p>
            </div>

            <div class="fieldset fieldset-grow">
              <div class="fieldset-label">Conditions</div>
              <p id="conditions" class="readout">—</p>
            </div>

            <div class="fieldset fieldset-grow">
              <div class="fieldset-label">Headlines</div>
              <ul id="headlines" class="headlines"></ul>
            </div>

            <div class="fieldset">
              <div class="fieldset-label">Layers</div>
              <label class="check"><input id="spin" type="checkbox" checked /> Auto-rotate</label>
              <label class="check"><input id="terminator" type="checkbox" checked /> Day / night line</label>
              <label class="check"><input id="quakes" type="checkbox" checked /> Earthquakes</label>
              <label class="check"><input id="flights" type="checkbox" /> Live flights</label>
            </div>

            <div class="fieldset fieldset-recent">
              <div class="fieldset-label">Recent</div>
              <ul id="recent" class="recent"></ul>
            </div>
          </div>
        </div>

        <div class="status-bar">
          <span id="status" class="status-panel status-panel-grow">Ready</span>
          <span id="clock" class="status-panel"></span>
        </div>
      </div>
    </div>

    <script type="module" src="globe-app.js"></script>
  </body>
</html>
